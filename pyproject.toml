[project]
name = "aegis"
version = "0.1.0"
description = "Security audit CLI - S3, headers, race conditions, recon, and OWASP checks in one tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emperor M.K", email = "emperormk01@gmail.com" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
